name: Sync upstream main

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out fork
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Merge upstream without overwriting fork changes
        shell: bash
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/kunchenguid/firstmate.git
          git fetch --no-tags upstream main
          git switch main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git merge --no-edit upstream/main; then
            git merge --abort
            echo "::error::Upstream conflicts with fork changes. Resolve on a review branch; main was not changed."
            exit 1
          fi
          git push origin HEAD:main
