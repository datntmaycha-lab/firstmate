name: Sync upstream main

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out fork
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Fast-forward main from upstream
        shell: bash
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/kunchenguid/firstmate.git
          git fetch --no-tags upstream main
          git switch main
          git merge --ff-only upstream/main
          git push origin HEAD:main
